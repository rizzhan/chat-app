info:
  name: Login sender
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:5000/api/auth/login
  body:
    type: json
    data: |-
      {
        "email": "rishan@example.com",
        "password": "123456"
      }
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body.token) {
          bru.setVar("token", res.body.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
